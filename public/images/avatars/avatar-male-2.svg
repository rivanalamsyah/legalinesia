      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d5c8"/>
      <stop offset="100%" stop-color="#e3a795"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad2)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Body / Coat -->
  <path d="M 30,195 Q 100,125 170,195 Z" fill="#1e293b"/>
  <polygon points="85,145 100,165 115,145 100,185" fill="#ffffff"/>
  <polygon points="97,160 103,160 105,195 95,195" fill="#047857"/>
  
  <!-- Neck -->
  <rect x="88" y="120" width="24" height="30" rx="4" fill="url(#skinGrad2)"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="31" ry="39" fill="url(#skinGrad2)"/>
  <ellipse cx="68" cy="92" rx="5" ry="9" fill="url(#skinGrad2)"/>
  <ellipse cx="132" cy="92" rx="5" ry="9" fill="url(#skinGrad2)"/>
  
  <!-- Modern Hair Style -->
  <path d="M 68,78 C 65,45 135,45 132,78 C 122,58 110,50 100,50 C 90,50 78,58 68,78 Z" fill="#0f172a"/>
  
  <!-- Eyes -->
