  <path d="M 107,80 Q 115,76 124,80" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Nose -->
  <path d="M 100,88 L 98,98 L 102,98" stroke="#cf8e7c" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Smile -->
