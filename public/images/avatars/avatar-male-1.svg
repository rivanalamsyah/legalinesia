<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0c5"/>
      <stop offset="100%" stop-color="#e2aa98"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Suit / Body -->
  <path d="M 30,195 Q 100,125 170,195 Z" fill="url(#suitGrad)"/>
  <!-- Shirt Collar -->
  <polygon points="85,145 100,165 115,145 100,180" fill="#ffffff"/>
  <!-- Tie -->
  <polygon points="96,160 104,160 106,195 94,195" fill="#2563eb"/>
  <!-- Lapel Left -->
  <path d="M 50,195 L 85,145 L 95,195 Z" fill="#334155"/>
  <!-- Lapel Right -->
  <path d="M 150,195 L 115,145 L 105,195 Z" fill="#334155"/>
  
  <!-- Neck -->
  <rect x="88" y="120" width="24" height="30" rx="4" fill="url(#skinGrad)"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="32" ry="40" fill="url(#skinGrad)"/>
  
  <!-- Ears -->
  <ellipse cx="67" cy="92" rx="6" ry="10" fill="url(#skinGrad)"/>
  <ellipse cx="133" cy="92" rx="6" ry="10" fill="url(#skinGrad)"/>
  
  <!-- Hair -->
  <path d="M 68,80 C 68,52 132,52 132,80 C 125,65 115,60 100,60 C 85,60 75,65 68,80 Z" fill="#1e293b"/>
  
  <!-- Glasses -->
  <rect x="74" y="80" width="20" height="14" rx="3" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <rect x="106" y="80" width="20" height="14" rx="3" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <line x1="94" y1="86" x2="106" y2="86" stroke="#d97706" stroke-width="2.5"/>
  
  <!-- Eyes -->
  <circle cx="84" cy="87" r="3" fill="#1e293b"/>
  <circle cx="116" cy="87" r="3" fill="#1e293b"/>
  
  <!-- Eyebrows -->
  <path d="M 74,75 Q 84,72 92,75" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 108,75 Q 116,72 126,75" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Nose -->
  <path d="M 100,88 L 98,98 L 102,98" stroke="#d09382" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Mouth / Confident Smile -->
  <path d="M 88,110 Q 100,118 112,110" stroke="#b96a58" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
