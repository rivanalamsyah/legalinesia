      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGradAdmin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0c5"/>
      <stop offset="100%" stop-color="#e2aa98"/>
