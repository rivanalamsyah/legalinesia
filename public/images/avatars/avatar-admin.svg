  <circle cx="115" cy="88" r="3.5" fill="#0f172a"/>
  
  <!-- Eyebrows -->
  <path d="M 76,80 Q 85,76 93,80" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 107,80 Q 115,76 124,80" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Nose & Smile -->
