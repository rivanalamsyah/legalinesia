  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradAdmin)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Body / Corporate Shirt -->
  <path d="M 30,195 Q 100,125 170,195 Z" fill="#1e293b"/>
  <polygon points="85,145 100,165 115,145 100,185" fill="#f8fafc"/>
  
  <!-- Neck -->
