<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d7da"/>
      <stop offset="100%" stop-color="#e8b4b8"/>
    </linearGradient>
    <linearGradient id="hijabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGradFemale)"/>
  <circle cx="100" cy="100" r="95" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Hijab Drape / Body -->
  <path d="M 25,195 C 40,130 160,130 175,195 Z" fill="url(#hijabGrad)"/>
  
  <!-- Inner Blazer -->
  <path d="M 75,195 L 100,150 L 125,195 Z" fill="#6b21a8"/>
  <polygon points="90,165 100,180 110,165 100,195" fill="#ffffff"/>
  
  <!-- Face Contour -->
  <ellipse cx="100" cy="95" rx="30" ry="38" fill="url(#skinGradF)"/>
  
  <!-- Hijab Frame around Face -->
  <path d="M 68,95 C 68,55 132,55 132,95 C 132,132 68,132 68,95 Z M 72,95 C 72,125 128,125 128,95 C 128,62 72,62 72,95 Z" fill="#1e1b4b"/>
  
  <!-- Eyes -->
  <ellipse cx="85" cy="92" rx="4" ry="5" fill="#1e293b"/>
  <ellipse cx="115" cy="92" rx="4" ry="5" fill="#1e293b"/>
  <circle cx="86" cy="90" r="1.5" fill="#ffffff"/>
  <circle cx="116" cy="90" r="1.5" fill="#ffffff"/>
  
  <!-- Eyelashes -->
  <path d="M 79,88 Q 85,84 91,88" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M 109,88 Q 115,84 121,88" stroke="#1e293b" stroke-width="2" fill="none"/>
  
  <!-- Eyebrows -->
  <path d="M 78,82 Q 85,78 92,83" stroke="#475569" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 108,83 Q 115,78 122,82" stroke="#475569" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  
  <!-- Nose -->
  <path d="M 100,92 L 98,102 L 102,102" stroke="#d09382" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  
  <!-- Lips -->
  <path d="M 88,114 Q 100,122 112,114 Q 100,120 88,114" fill="#be185d"/>
</svg>
